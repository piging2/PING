# ping-gateway compose service definition (connectors lane, 2026-09-24)
#
# Reconstructed from `docker inspect ping-gateway` (container created 2026-09-16,
# started via `docker run`, NOT compose-managed). This file gives the gateway a
# real, versioned service definition including the Docker HEALTHCHECK it lacked.
#
# IMAGE NOTE: the live container runs ping-gateway:devin-boundary2 (built
# 2026-09-16, no OCI labels, provenance UNKNOWN, known to predate the P0 gate).
# The 2026-09-23 promotion decision names jev/verdict-authority-hardening @
# fffe99f7a4174cc694c65c9ac1b0b00b4332bf2f as the certified candidate. Swap
# GATEWAY_IMAGE at promotion time; do not bake the old tag in.
#
# SECRETS: MUSE_LEVEL_1_KEY, MUSE_LEVEL_2_KEY, POSTGRES_PASSWORD must be supplied
# via a Pig-side .env file (same directory as this compose file). They are
# NEVER committed. Non-secret values carry the observed live defaults below.
#
# WHY NOT CUT OVER YET (recorded 2026-09-24): the live 8080 container is the
# pre-promotion image about to be replaced; recreating it now is churn on a
# deprecated deployment. Cut over at promotion time with the certified image.
# Rollback then = `docker compose down` + re-run the old `docker run` (recorded
# in the lane report).

services:
  ping-gateway:
    image: ${GATEWAY_IMAGE:-ping-gateway:devin-boundary2}
    container_name: ping-gateway
    working_dir: /app
    command: ["node", "gateway/server.js"]
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: 8080
      QDRANT_HOST: ${QDRANT_HOST:-ping-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      QDRANT_URL: ${QDRANT_URL:-http://host.docker.internal:6333}
      POSTGRES_HOST: ${POSTGRES_HOST:-host.docker.internal}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ping_runtime}
      MUSE_LEVEL_1_KEY: ${MUSE_LEVEL_1_KEY:?set in Pig-side .env}
      MUSE_LEVEL_2_KEY: ${MUSE_LEVEL_2_KEY:?set in Pig-side .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in Pig-side .env}
    volumes:
      - muse-workspace:/app/workspace/muse
    restart: unless-stopped
    healthcheck:
      # Same probe the Oracle canonical compose uses; proven 200 against the
      # live gateway 2026-09-24 (node exists in the gateway image).
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8080/health', (r) => {if (r.statusCode !== 200) console.error('health status: ' + r.statusCode); process.exit(r.statusCode === 200 ? 0 : 1)})\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  muse-workspace:
    external: true
